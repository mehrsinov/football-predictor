name: (غیرفعال) daily-football — سنگ‌قبر زمان‌بندی قدیمی

# این فایل عمداً «سنگ‌قبر» (tombstone) است و هیچ کار واقعی‌ای انجام نمی‌دهد.
#
# چرا وجود دارد؟
#   نسخهٔ قبلیِ همین مسیر (.github/workflows/main.yml) یک زمان‌بندی cron روزانه
#   داشت. وقتی آن فایل حذف شد، GitHub زمان‌بندی را به‌صورت «زامبی» نگه داشت و هر
#   روز روی کامیت قدیمی (7366468) اجرا و fail می‌شد → ایمیل خطای روزانه برای
#   صاحب مخزن و شلوغ‌شدن تب Actions. چون فایلِ حذف‌شده دیگر جزو workflowهای «فعال»
#   نیست، endpoint غیرفعال‌سازی API هم آن را نمی‌پذیرد:
#       403 Unable to disable a workflow that is not active
#
# تنها راهِ قطعیِ کشتن آن zombie cron: همان فایل را دوباره در همین مسیر بگذاریم
# اما بدون هیچ `schedule`. آنگاه GitHub همین workflow (id 319472177) را با محتوای
# جدیدِ بی‌cron دوباره ثبت می‌کند و زمان‌بندیِ زامبی از بین می‌رود.
#
# پایپ‌لاین واقعیِ روزانه اینجاست:  .github/workflows/daily.yml

on:
  workflow_dispatch: {}   # فقط اجرای دستی؛ هیچ زمان‌بندی‌ای وجود ندارد

jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "این workflow غیرفعال است و کاری انجام نمی‌دهد."
          echo "پایپ‌لاین واقعی: .github/workflows/daily.yml"
